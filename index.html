<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple Wikipedia viewer application">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Wikipedia Viewer</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
</head>

<body>
    <h1 id="top">
        GeeksforGeeks
    </h1>
    <h1>
        Wikipedia Viewer
    </h1>
    <div class="container-new" role="main" aria-label="Wikipedia search container">
        <div id="searchBox" aria-label="Search results">
            <input type="text"
                   id="search"
                   autocomplete="off"
                   placeholder="Search here"
                   aria-label="Search Wikipedia articles" />
        </div>
    </div>
</body>
    <script src="script.js" defer></script>
</html>
